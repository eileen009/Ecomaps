<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoMaps · {% block titulo %}Panel de administración{% endblock %}</title>
  <meta name="description" content="Panel de administración de EcoMaps: gestión de puntos de reciclaje, empresas, usuarios y estadísticas.">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-body">

  <div class="admin">

    <!-- ===== Barra lateral (compartida por todas las vistas del panel admin) ===== -->
    <aside class="admin__sidebar">
      <div>
        <a href="{{ url_for('paginas.inicio') }}" class="logo" style="margin-bottom:2px;">
          <img src="{{ url_for('static', filename='assets/img/logo.png') }}" alt="EcoMaps" class="logo__img" width="30" height="30">
          <span class="logo__text">EcoMaps</span>
        </a>
        <p style="margin:0 0 0 40px; font-size:0.7rem; color:#A9C27C;">Panel admin</p>
      </div>

      <div>
        <p class="admin__sidebar-label">Menú principal</p>
        <nav class="admin__nav">
          <a href="{{ url_for('paginas.admin') }}" class="{{ 'is-active' if activo == 'puntos' else '' }}">📍 Puntos de reciclaje <span class="admin__nav-count">85</span></a>
          <a href="#">👤 Usuarios</a>
          <a href="#">🗑 Residuos</a>
          <a href="#">📈 Reportes</a>
          <a href="{{ url_for('paginas.admin_empresas') }}" class="{{ 'is-active' if activo == 'empresas' else '' }}">🏢 Empresas y organizaciones</a>
          <a href="{{ url_for('paginas.admin_estadisticas') }}" class="{{ 'is-active' if activo == 'estadisticas' else '' }}">📉 Estadísticas</a>
          <a href="#">⚙ Configuración</a>
        </nav>
      </div>

      <div class="admin__sidebar-user">
        <span class="admin__avatar">CA</span>
        <div>
          <strong style="font-size:0.85rem; color:var(--blanco);">Carlos Admin</strong>
          <small>Administrador</small>
        </div>
      </div>
    </aside>

    <!-- ===== Contenido principal (cada vista rellena su propio bloque) ===== -->
    <main class="admin__main">
      <div class="admin__topbar">
        <p class="admin__topbar-crumbs">Panel / <strong>{% block migas %}Dashboard{% endblock %}</strong></p>
        <div class="admin__topbar-right">
          <span class="admin__bell">🔔<span class="admin__bell-dot">3</span></span>
          <span class="admin__avatar">CA</span>
        </div>
      </div>

      {% block contenido %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
