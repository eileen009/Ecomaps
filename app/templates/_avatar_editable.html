{# Foto de perfil editable (la maneja static/js/cuenta.js). Se incluye en perfil y empresa. #}
<div class="profile-card__foto">
  <label class="profile-avatar profile-avatar--editable" id="avatar" data-marco="ninguno" title="Cambiar foto de perfil">
    <img class="profile-avatar__img" data-perfil="foto" src="{{ url_for('static', filename='assets/img/avatar-default.svg') }}" alt="Foto de perfil">
    <span class="profile-avatar__editar" aria-hidden="true">📷</span>
    <input type="file" id="avatar-input" accept="image/jpeg,image/png,image/webp" aria-label="Subir foto de perfil">
  </label>
  <p class="profile-avatar__ayuda" data-perfil="avatar-msg">Toca tu foto para cambiarla<br>(JPG, PNG o WEBP · máx. 5 MB)</p>
</div>
