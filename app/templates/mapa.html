<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoMaps · Mapa de puntos de reciclaje</title>
  <meta name="description" content="Encuentra en el mapa los puntos de reciclaje más cercanos a ti, filtrados por tipo de residuo.">
  {% include '_head_publico.html' %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body class="publico">

  {% include '_header_publico.html' %}

  <main>
    <div class="container"><p class="breadcrumb"><a href="{{ url_for('paginas.inicio') }}">Inicio</a> › Mapa</p></div>
    <section class="map-hero">
      <div class="container">
        <!-- Única barra de filtros: buscador de texto + chips de material + distancia -->
        <form class="map-searchbar reveal" role="search">
          <svg class="search-bar__icon" width="20" height="20" aria-hidden="true"><use href="{{ url_for('static', filename='assets/img/iconos.svg') }}#i-buscar"/></svg>
          <input type="search" id="mapa-buscador" placeholder="Ej. plástico, baterías, vidrio, cartón..." autocomplete="off">
          <button type="submit" class="btn btn--primary">Buscar</button>
        </form>

        <div class="map-toolbar reveal">
          <div class="map-quicktags">
            <button type="button">Plástico</button>
            <button type="button">Vidrio</button>
            <button type="button">Baterías</button>
            <button type="button">Electrónico</button>
            <button type="button">Cartón</button>
            <button type="button">Orgánico</button>
          </div>
          <select id="mapa-distancia" class="map-toolbar__distancia" aria-label="Distancia">
            <option value="">Distancia: todas</option>
            <option value="1">Menos de 1 km</option>
            <option value="3">Menos de 3 km</option>
            <option value="5">Menos de 5 km</option>
          </select>
        </div>
      </div>
    </section>

    <section class="map-layout container reveal">
      <!-- Mapa real: OpenStreetMap vía Leaflet, sin necesidad de API key -->
      <div class="map-canvas">
        <div id="mapa-leaflet"></div>
        <!-- Ubicación: se pide al tocar el botón (en iPhone/Android el permiso
             solo aparece de forma fiable cuando lo pide un toque del usuario) -->
        <button type="button" class="map-canvas__ubicarme" data-ubicarme aria-label="Usar mi ubicación">📍 Mi ubicación</button>
        <p class="map-canvas__ubicacion-msg" data-ubicacion-msg role="status" hidden></p>
        <div class="map-canvas__ctas">
          <a href="{{ url_for('paginas.reportar') }}" class="btn btn--outline map-canvas__btn-reportar"><svg width="16" height="16" aria-hidden="true"><use href="{{ url_for('static', filename='assets/img/iconos.svg') }}#i-alerta"/></svg>Reportar problema</a>
          <a href="{{ url_for('paginas.proponer') }}" class="btn btn--primary"><svg width="16" height="16" aria-hidden="true"><use href="{{ url_for('static', filename='assets/img/iconos.svg') }}#i-mas"/></svg>Proponer punto</a>
        </div>
      </div>

      <!-- Panel lateral: puntos activos, cargados desde /api/puntos -->
      <aside class="map-layout__panel">
        <div class="map-layout__panel-header">
          <h2>Puntos cercanos</h2>
          <span class="badge badge--muted" id="contador-puntos">Cargando…</span>
        </div>

        <div class="map-layout__panel-lista" id="lista-puntos"></div>
      </aside>
    </section>
  </main>

  <div class="container">
    {% include '_contacto_empresas.html' %}
  </div>

  {% include '_footer_publico.html' %}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/publico.js') }}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="{{ url_for('static', filename='js/mapa.js') }}"></script>
</body>
</html>
